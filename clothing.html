<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Charlyn Clothing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Header -->
<header class="flex justify-between items-center px-6 py-4 bg-black text-white sticky top-0 z-50">
  <div class="flex items-center">
    <img src="images/logo.png" class="w-10 h-10 mr-2" alt="Logo" />
    <span class="font-bold text-xl">CHARLYN STORE</span>
  </div>
  <nav class="space-x-4">
    <a href="index.html" class="hover:text-indigo-400">Home</a>
    <a href="clothing.html" class="hover:text-indigo-400">Clothing</a>
    <a href="food.html" class="hover:text-indigo-400">Food</a>
    <a href="#" class="hover:text-indigo-400">About</a>
    <a href="#" class="hover:text-indigo-400">Contact</a>
    <a href="#" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Signup</a>
  </nav>
</header>
<body class="bg-gray-100 text-black font-sans">
  <!-- Header (same as index) -->
  <!-- ... omit for brevity -->
  
  <section class="px-6 py-12">
    <h2 class="text-4xl font-bold text-center mb-10 uppercase">Clothing & Accessories</h2>
    <div id="clothingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-6">
      <!-- JS-injected product cards -->
    </div>
  </section>

  <!-- Modals (hidden by default) -->
  <div id="modals"></div>

  <!-- Cart + Paystack button -->
  <div id="cartDiv" class="fixed bottom-4 right-4 bg-white p-4 rounded-lg shadow-lg hidden">
    <p id="cartTotal" class="font-bold">Total: ₦0</p>
    <button id="checkoutBtn" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Checkout (50%)</button>
  </div>

  <!-- Scripts -->
  <script>
  const products = [
  { id: 'cloth1', name: 'Classic White Tee', price: 6000, desc: 'White cotton tee with minimalist design', image: 'images/clothing/cloth1.jpg', delivery: '2–3 days' },
  { id: 'cloth2', name: 'Black Hoodie', price: 8000, desc: 'Cozy hoodie with bold logo print', image: 'images/clothing/cloth2.jpg', delivery: '2–3 days' },
  { id: 'cloth3', name: 'Vintage Cap', price: 3000, desc: 'Throwback style cap with embroidery', image: 'images/clothing/cloth3.jpg', delivery: '2–3 days' },
  { id: 'cloth4', name: 'Graffiti Tee', price: 6500, desc: 'Street art inspired print tee', image: 'images/clothing/cloth4.jpg', delivery: '2–3 days' },
  { id: 'cloth5', name: 'Cropped Top', price: 5500, desc: 'Stylish cropped wear for women', image: 'images/clothing/cloth5.jpg', delivery: '2–3 days' },
  { id: 'cloth6', name: 'Joggers', price: 7000, desc: 'Comfy joggers for everyday wear', image: 'images/clothing/cloth6.jpg', delivery: '2–3 days' },
  { id: 'cloth7', name: 'Denim Jacket', price: 10000, desc: 'Blue denim with distressed finish', image: 'images/clothing/cloth7.jpg', delivery: '2–3 days' },
  { id: 'cloth8', name: 'Bomber Jacket', price: 9500, desc: 'Black bomber for casual days', image: 'images/clothing/cloth8.jpg', delivery: '2–3 days' },
  { id: 'cloth9', name: 'Traditional Ankara Shirt', price: 7500, desc: 'Afrocentric design in vibrant colors', image: 'images/clothing/cloth9.jpg', delivery: '2–3 days' },
  { id: 'cloth10', name: 'Bucket Hat', price: 3500, desc: 'Retro accessory in mixed colors', image: 'images/clothing/cloth10.jpg', delivery: '2–3 days' },
  ];

  const cart = [];

  const grid = document.getElementById('clothingGrid');
  const modals = document.getElementById('modals');
  const cartDiv = document.getElementById('cartDiv');
  const cartTotalEl = document.getElementById('cartTotal');
  const checkoutBtn = document.getElementById('checkoutBtn');

  function showProducts() {
    products.forEach(p => {
      // Card
      const card = document.createElement('div');
      card.className = 'relative overflow-hidden rounded-lg shadow-lg bg-white group';
      card.innerHTML = `
        <img src="${p.image}" alt="${p.name}" class="w-full h-64 object-cover group-hover:scale-110 transition-transform"/>
        <span class="absolute top-2 right-2 bg-yellow-300 text-black px-2 py-1 text-xs rounded">${p.delivery}</span>
        <div class="absolute bottom-0 left-0 right-0 p-4 bg-white">
          <h3 class="font-bold">${p.name}</h3>
          <p class="text-gray-600 text-sm">₦${p.price}</p>
          <div class="mt-2 flex justify-between">
            <button class="text-indigo-600 font-semibold" onclick="openModal('${p.id}')">View</button>
            <button class="bg-indigo-600 text-white px-3 py-1 rounded" onclick="addToCart('${p.id}')">Add</button>
          </div>
        </div>`;
      grid.appendChild(card);
      // Modal
      const modal = document.createElement('div');
      modal.id = 'modal-' + p.id;
      modal.className = 'fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden';
      modal.innerHTML = `
        <div class="bg-white rounded-lg p-6 max-w-lg w-full relative">
          <button class="absolute top-4 right-4 text-gray-600" onclick="closeModal('${p.id}')">&times;</button>
          <img src="${p.image}" alt="${p.name}" class="w-full h-64 object-cover rounded"/>
          <h3 class="text-2xl font-bold mt-4">${p.name}</h3>
          <p class="text-gray-700 mt-2">${p.desc}</p>
          <p class="mt-2 font-semibold">₦${p.price}. Pay 50% now</p>
          <button class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded" onclick="addToCart('${p.id}'); closeModal('${p.id}')">Add to Cart</button>
        </div>`;
      modals.appendChild(modal);
    });
  }

  function openModal(id){ document.getElementById('modal-'+id).style.display='flex'; }
  function closeModal(id){ document.getElementById('modal-'+id).style.display='none'; }

  function addToCart(id){
    const item = products.find(p=>p.id===id);
    cart.push(item);
    cartDiv.style.display = 'block';
    const total = cart.reduce((a,b)=>a+b.price,0)/2;
    cartTotalEl.innerText = `Pay 50%: ₦${total}`;
  }

  checkoutBtn.addEventListener('click', ()=>{
    const total = cart.reduce((a,b)=>a+b.price,0)/2;
    // TODO: replace with your backend Paystack checkout endpoint
    window.location.href = `https://paystack.com/pay?amount=${total*100}&redirect_url=/success`;
  });

  showProducts();
  </script>
</body>
</html>
