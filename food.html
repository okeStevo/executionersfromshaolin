<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Charlyn Food</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<!-- Header -->
<header class="flex justify-between items-center px-6 py-4 bg-black text-white sticky top-0 z-50">
  <div class="flex items-center">
    <img src="images/logo.png" class="w-10 h-10 mr-2" alt="Logo" />
    <span class="font-bold text-xl">CHARLYN STORE</span>
  </div>
  <nav class="space-x-4">
    <a href="index.html" class="hover:text-indigo-400">Home</a>
    <a href="clothing.html" class="hover:text-indigo-400">Clothing</a>
    <a href="food.html" class="hover:text-indigo-400">Food</a>
    <a href="#" class="hover:text-indigo-400">About</a>
    <a href="#" class="hover:text-indigo-400">Contact</a>
    <a href="#" class="bg-indigo-500 text-white px-4 py-2 rounded hover:bg-indigo-600">Signup</a>
  </nav>
</header>
<body class="bg-gray-50 text-black font-sans">
  <!-- Header (same) -->
  <!-- ... -->

  <section class="px-6 py-12">
    <h2 class="text-4xl font-bold text-center mb-10 uppercase">Food Menu</h2>
    <div id="foodGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-6"></div>
  </section>

  <div id="modalsFood"></div>
  <div id="cartDivFood" class="fixed bottom-4 right-4 bg-white p-4 rounded-lg shadow-lg hidden">
    <p id="cartTotalFood" class="font-bold">Total: ₦0</p>
    <button id="checkoutBtnFood" class="mt-2 bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Checkout (50%)</button>
  </div>

  <script>
  const foods = [
  { id: 'food1', name: 'Egusi Soup', price: 2500, desc: 'Rich melon seed soup with pounded yam', image: 'images/food/food3.jpg', delivery: '30–45 mins' },
  { id: 'food2', name: 'Amala & Ewedu', price: 2200, desc: 'Yoruba classic with gbegiri and meat', image: 'images/food/food2.jpg', delivery: '30–45 mins' },
  { id: 'food3', name: 'Pap & Akara', price: 1800, desc: 'Early morning combo that slaps', image: 'images/food/food9.jpg', delivery: '30–45 mins' },
  { id: 'food4', name: 'Spaghetti Jollof', price: 2000, desc: 'Hot and spicy with dodo and beef', image: 'images/food/food11.jpg', delivery: '30–45 mins' },
  { id: 'food5', name: 'Ofada Rice & Sauce', price: 2600, desc: 'Peppery ayamase goodness', image: 'images/food/food7.jpg', delivery: '30–45 mins' },
  { id: 'food6', name: 'Fried Rice', price: 2400, desc: 'Colorful rice with veggies and chicken', image: 'images/food/food5.jpg', delivery: '30–45 mins' },
  { id: 'food7', name: 'Indomie & Egg', price: 1500, desc: 'Instant legend with a twist', image: 'images/food/food6.jpg', delivery: '30–45 mins' },
  { id: 'food8', name: 'Okro Soup', price: 2300, desc: 'Draw soup delight with assorted', image: 'images/food/food8.jpg', delivery: '30–45 mins' },
  { id: 'food9', name: 'Pap & Moi Moi', price: 2000, desc: 'Soft pap with bean cake pairing', image: 'images/food/food10.jpg', delivery: '30–45 mins' },
  { id: 'food10', name: 'Yam & Egg Sauce', price: 1900, desc: 'Fried yam slices with peppery egg', image: 'images/food/food12.jpg', delivery: '30–45 mins' },
  { id: 'food11', name: 'Afang & Semo', price: 3000, desc: 'Delicious assorted afang soup with semo', image: 'images/food/food1.jpg', delivery: '30–45 mins' },
  { id: 'food12', name: 'Beans & Plantain', price: 1900, desc: 'Hot and spicy plantain with beans', image: 'images/food/food4.jpg', delivery: '30–45 mins' },
];
  const cartF = [];

  function showFoods(){
    const grid = document.getElementById('foodGrid');
    const modals = document.getElementById('modalsFood');
    foods.forEach(p => {
      const card = document.createElement('div');
      card.className='relative overflow-hidden rounded-lg shadow-lg bg-white group';
      card.innerHTML=`
        <img src="${p.image}" alt="${p.name}" class="w-full h-64 object-cover group-hover:scale-110 transition-transform"/>
        <span class="absolute top-2 right-2 bg-yellow-300 text-black px-2 py-1 text-xs rounded">${p.delivery}</span>
        <div class="absolute bottom-0 left-0 right-0 p-4 bg-white">
          <h3 class="font-bold">${p.name}</h3>
          <p class="text-gray-600 text-sm">₦${p.price}</p>
          <div class="mt-2 flex justify-between">
            <button class="text-indigo-600 font-semibold" onclick="openModalF('${p.id}')">View</button>
            <button class="bg-indigo-600 text-white px-3 py-1 rounded" onclick="addToCartF('${p.id}')">Add</button>
          </div>
        </div>`;
      grid.appendChild(card);

      const modal = document.createElement('div');
      modal.id='modalF-'+p.id;
      modal.className='fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden';
      modal.innerHTML=`
        <div class="bg-white rounded-lg p-6 max-w-lg w-full relative">
          <button class="absolute top-4 right-4 text-gray-600" onclick="closeModalF('${p.id}')">&times;</button>
          <img src="${p.image}" alt="${p.name}" class="w-full h-64 object-cover rounded"/>
          <h3 class="text-2xl font-bold mt-4">${p.name}</h3>
          <p class="text-gray-700 mt-2">${p.desc}</p>
          <p class="mt-2 font-semibold">₦${p.price}. Pay 50% now</p>
          <button class="mt-4 bg-indigo-600 text-white px-4 py-2 rounded" onclick="addToCartF('${p.id}'); closeModalF('${p.id}')">Add to Cart</button>
        </div>`;
      modals.appendChild(modal);
    });
  }

  function openModalF(id){ document.getElementById('modalF-'+id).style.display='flex'; }
  function closeModalF(id){ document.getElementById('modalF-'+id).style.display='none'; }

  function addToCartF(id){
    const item = foods.find(p=>p.id===id);
    cartF.push(item);
    document.getElementById('cartDivFood').style.display='block';
    const total = cartF.reduce((a,b)=>a+b.price,0)/2;
    document.getElementById('cartTotalFood').innerText = `Pay 50%: ₦${total}`;
  }

  document.getElementById('checkoutBtnFood').addEventListener('click', ()=>{
    const total = cartF.reduce((a,b)=>a+b.price,0)/2;
    window.location.href = `https://paystack.com/pay?amount=${total*100}&redirect_url=/success`;
  });

  showFoods();
  </script>
</body>
</html>
